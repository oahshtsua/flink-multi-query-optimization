name: flink-mqo

services:
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS}
      KAFKA_HEAP_OPTS: -Xms${KAFKA_HEAP} -Xmx${KAFKA_HEAP}
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092
      interval: 5s

  jobmanager:
    build: .
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES: |
        jobmanager.memory.process.size: ${JM_MEMORY}
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    ports:
      - "8081:8081"
    healthcheck:
      test: curl -sf http://localhost:8081/overview
      interval: 5s

  taskmanager:
    build: .
    command: taskmanager
    scale: ${TM_COUNT}
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: ${TM_SLOTS}
      FLINK_PROPERTIES: |
        taskmanager.memory.process.size: ${TM_MEMORY}
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  sql-gateway:
    build: .
    command: bin/sql-gateway.sh start-foreground -Dsql-gateway.endpoint.rest.address=0.0.0.0
    environment:
      FLINK_PROPERTIES: |
        rest.address: jobmanager
        parallelism.default: ${PARALLELISM}
    ports:
      - "8083:8083"
    healthcheck:
      test: curl -sf http://localhost:8083/v1/info
      interval: 5s

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    privileged: true
    command:
      - --docker_only
      - --enable_metrics=cpu,memory,network
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --housekeeping_interval=5s
      - --allow_dynamic_housekeeping=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: wget -qO- http://localhost:9090/-/ready
      interval: 5s

  generator:
    build: ../harness
    profiles: [manual]
    command: python generator.py
    environment:
      RATE: ${RATE}

  python:
    image: python:3.14-slim
    entrypoint: python
    profiles: [manual]
    volumes:
      - ..:/work:ro
    working_dir: /work
