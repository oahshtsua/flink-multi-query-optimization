name: flink-mqo

services:
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS}
      KAFKA_HEAP_OPTS: -Xms${KAFKA_HEAP} -Xmx${KAFKA_HEAP}
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092
      interval: 5s

  jobmanager:
    build: .
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES: "jobmanager.memory.process.size: ${JM_MEMORY}"
    ports:
      - "8081:8081"
    healthcheck:
      test: curl -sf http://localhost:8081/overview
      interval: 5s

  taskmanager:
    build: .
    command: taskmanager
    scale: ${TM_COUNT}
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: ${TM_SLOTS}
      FLINK_PROPERTIES: "taskmanager.memory.process.size: ${TM_MEMORY}"

  sql-gateway:
    build: .
    command: bin/sql-gateway.sh start-foreground -Dsql-gateway.endpoint.rest.address=0.0.0.0
    environment:
      FLINK_PROPERTIES: |
        rest.address: jobmanager
        parallelism.default: ${PARALLELISM}
    ports:
      - "8083:8083"
    healthcheck:
      test: curl -sf http://localhost:8083/v1/info
      interval: 5s

  python:
    image: python:3.14-slim
    entrypoint: python
    profiles: [manual]
    volumes:
      - ..:/work:ro
    working_dir: /work
